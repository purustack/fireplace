# Production stack for a Vultr VPS (app + reverse proxy).
# Database stays on Neon — set DATABASE_URL in .env.production.

services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - fireplace_storage:/app/storage
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  fireplace_storage:
  caddy_data:
  caddy_config:
